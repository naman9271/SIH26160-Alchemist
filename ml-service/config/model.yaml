# Runtime model and UNKNOWN-rejection configuration.
version: 1

model:
  training_dataset_path: ../data/processed/training_dataset.parquet
  models_dir: ../models
  training_metrics_path: ../artifacts/training_metrics.json

feature_extraction:
  window_duration_seconds: 30.0
  burst_gap_seconds: 0.1
  idle_gap_seconds: 1.0

grpc:
  host: 127.0.0.1
  port: 50051
  max_workers: 4
  request_timeout_seconds: 5.0
  shutdown_grace_seconds: 5.0
  explanations_enabled: false

unknown_detection:
  method: max_class_probability_threshold
  # Written by `python -m src.calibrate_unknown` after real held-out known and
  # OOD samples are available. Null deliberately fails closed before calibration.
  confidence_threshold: null
  candidate_thresholds:
    - 0.30
    - 0.40
    - 0.50
    - 0.60
    - 0.65
    - 0.70
    - 0.75
    - 0.80
    - 0.85
    - 0.90
    - 0.95
  # Add preprocessed Parquet paths here, or pass --ood-dataset repeatedly.
  # Eligible records must be from a class absent from the fitted model or from
  # a dataset_source absent from training. Paths are relative to this file.
  ood_dataset_paths: []
  calibration_metrics_path: ../artifacts/unknown_calibration.json
  limitation: >-
    Confidence-threshold rejection is a baseline open-set method and cannot
    perfectly detect every unknown or out-of-distribution traffic type.

anomaly_detection:
  enabled: false
  method: isolation_forest
  contamination: 0.05
  n_estimators: 200
  random_seed: 42
  normalization_quantiles:
    - 0.01
    - 0.99
  model_path: ../models/isolation_forest.joblib
  metadata_path: ../models/anomaly_metadata.json
  metrics_path: ../artifacts/anomaly_metrics.json
  # Optional labeled Parquet with the exact model features and a boolean
  # `is_anomaly` column. Null means report held-out normal metrics only.
  evaluation_dataset_path: null
