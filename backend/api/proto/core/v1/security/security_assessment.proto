syntax = "proto3";

package core.security.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/naman9271/SIH26160---Team-Alchemist/gen/go/api/proto/core/v1/security;securityv1";

service SecurityAssessmentService {
  rpc Run(RunSecurityAssessmentRequest) returns (RunSecurityAssessmentResponse);
  rpc Get(GetSecurityAssessmentRequest) returns (SecurityAssessment);
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse);
  rpc GetFinding(GetFindingRequest) returns (SecurityFinding);
  rpc GetThreatMatrix(GetThreatMatrixRequest) returns (ThreatMatrix);
  rpc ListRecommendations(ListRecommendationsRequest) returns (ListRecommendationsResponse);
  rpc GetCompliance(GetComplianceRequest) returns (ComplianceSummary);
  rpc GetMetadataExposure(GetMetadataExposureRequest) returns (MetadataExposureAssessment);
  rpc Reevaluate(ReevaluateSecurityRequest) returns (ReevaluateSecurityResponse);
}

enum AssessmentState { ASSESSMENT_STATE_UNSPECIFIED = 0; ASSESSMENT_RUNNING = 1; ASSESSMENT_COMPLETED = 2; ASSESSMENT_FAILED = 3; }
enum ControlStatus { CONTROL_STATUS_UNSPECIFIED = 0; PASS = 1; FAIL = 2; UNKNOWN = 3; NOT_APPLICABLE = 4; }
message RunSecurityAssessmentRequest { string analysis_id = 1; string policy_id = 2; }
message RunSecurityAssessmentResponse { string assessment_id = 1; AssessmentState state = 2; }
message GetSecurityAssessmentRequest { string assessment_id = 1; }
message SecurityAssessment { string assessment_id = 1; string analysis_id = 2; string policy_id = 3; AssessmentState state = 4; uint32 score = 5 [deprecated = true]; string grade = 6; repeated SecurityFinding findings = 7; google.protobuf.Timestamp evaluated_at = 8; string failure_reason = 9; string policy_label = 10; string policy_reference = 11; repeated SecurityControlResult controls = 12; double observed_security_score = 13; bool score_available = 14; double evidence_coverage = 15; bool coverage_available = 16; double security_lower_bound = 17; double security_upper_bound = 18; bool provisional = 19; bool critical_score_cap_applied = 20; repeated SASecurityScore per_sa_scores = 21; repeated string incomplete_sa_resource_ids = 22; }
message SASecurityScore { string resource_type = 1; string resource_id = 2; double observed_security_score = 3; bool score_available = 4; double evidence_coverage = 5; bool coverage_available = 6; double security_lower_bound = 7; double security_upper_bound = 8; bool provisional = 9; bool critical_score_cap_applied = 10; string grade = 11; }
message ListFindingsRequest { string assessment_id = 1; string severity = 2; uint32 page_size = 3; string page_token = 4; }
message ListFindingsResponse { repeated SecurityFinding findings = 1; string next_page_token = 2; }
message GetFindingRequest { string assessment_id = 1; string finding_id = 2; }
message SupportingEvidence { string property_key = 1; string normalized_value = 2; repeated string evidence_ids = 3; repeated string sources = 4; }
message SecurityControlResult { string control_id = 1; string area = 2; string title = 3; ControlStatus status = 4; string severity = 5; string explanation = 6; string remediation = 7; string affected_resource_type = 8; string affected_resource_id = 9; repeated SupportingEvidence evidence = 10; string policy_id = 11; string policy_reference = 12; double weight = 13; string category = 14; }
message SecurityFinding { string finding_id = 1; string rule_id = 2; string title = 3; string severity = 4; string category = 5; string description = 6; string recommendation = 7; repeated string evidence_properties = 8; string affected_resource_type = 9; string affected_resource_id = 10; repeated SupportingEvidence evidence = 11; string policy_id = 12; string policy_reference = 13; }
message GetThreatMatrixRequest { string assessment_id = 1; }
message ThreatMatrix { map<string,uint64> severity_counts = 1; repeated SecurityFinding findings = 2; }
message ListRecommendationsRequest { string assessment_id = 1; }
message Recommendation { string priority = 1; string text = 2; repeated string rule_ids = 3; }
message ListRecommendationsResponse { repeated Recommendation recommendations = 1; }
message GetComplianceRequest { string assessment_id = 1; }
message ComplianceSummary { string policy_id = 1; uint64 rules_evaluated = 2; uint64 rules_failed = 3; uint64 rules_unknown = 4; uint64 rules_not_applicable = 5; string label = 6; string policy_reference = 7; }
message GetMetadataExposureRequest { string assessment_id = 1; }
message MetadataExposureAssessment { bool observable = 1; string status = 2; string explanation = 3; }
message ReevaluateSecurityRequest { string assessment_id = 1; string policy_id = 2; }
message ReevaluateSecurityResponse { string assessment_id = 1; AssessmentState state = 2; }
