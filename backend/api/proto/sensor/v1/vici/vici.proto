syntax = "proto3";

package sensor.vici.v1;
import "google/protobuf/timestamp.proto";
import "api/proto/common/v1/evidence.proto";
option go_package = "github.com/naman9271/SIH26160---Team-Alchemist/gen/go/api/proto/sensor/v1/vici;viciv1";

service StrongSwanViciService {
 rpc Probe(ProbeViciRequest) returns (ProbeViciResponse); rpc GetCapabilities(GetViciCapabilitiesRequest) returns (ViciCapabilities); rpc GetDaemonStats(GetDaemonStatsRequest) returns (ViciDaemonStats); rpc ListIkeSas(ListIkeSasRequest) returns (ListIkeSasResponse); rpc GetIkeSa(GetIkeSaRequest) returns (IkeSa); rpc ListChildSas(ListChildSasRequest) returns (ListChildSasResponse); rpc GetChildSa(GetChildSaRequest) returns (ChildSa); rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse); rpc GetConnection(GetConnectionRequest) returns (StrongSwanConnection); rpc ListPolicies(ListViciPoliciesRequest) returns (ListViciPoliciesResponse); rpc ListAlgorithms(ListAlgorithmsRequest) returns (ListAlgorithmsResponse); rpc GetCounters(GetCountersRequest) returns (ViciCounters); rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse); rpc ListAuthorities(ListAuthoritiesRequest) returns (ListAuthoritiesResponse); rpc GetGatewaySnapshot(GetGatewaySnapshotRequest) returns (GatewaySnapshot); rpc StreamEvents(StreamViciEventsRequest) returns (stream ViciEvent);
}
message ProbeViciRequest { string socket_uri = 1; } message ProbeViciResponse { bool available = 1; string socket_uri = 2; bool charon_reachable = 3; }
message GetViciCapabilitiesRequest { string socket_uri = 1; } message ViciCapabilities { bool list_sas = 1; bool list_connections = 2; bool list_policies = 3; bool list_algorithms = 4; bool stats = 5; bool counters = 6; bool list_certificates = 7; bool list_authorities = 8; bool events = 9; }
message GetDaemonStatsRequest { string socket_uri = 1; } message ViciDaemonStats { uint64 uptime_seconds = 1; uint32 worker_threads_total = 2; uint32 worker_threads_idle = 3; uint32 ike_sa_total = 4; uint32 ike_sa_half_open = 5; repeated string loaded_plugins = 6; }
message IkeSa { string name = 1; uint64 unique_id = 2; string state = 3; string ike_version = 4; string local_host = 5; uint32 local_port = 6; string remote_host = 7; uint32 remote_port = 8; string local_identity = 9; string remote_identity = 10; bool initiator = 11; string initiator_spi = 12; string responder_spi = 13; string encryption_algorithm = 14; uint32 encryption_key_size = 15; string integrity_algorithm = 16; string prf = 17; string dh_group = 18; uint64 established_duration = 19; uint64 rekey_time = 20; uint64 reauth_time = 21; repeated ChildSa associated_child_sas = 22; ipsec.common.v1.EvidenceStatus evidence_status = 23; }
message ChildSa { string name = 1; uint64 unique_id = 2; uint32 reqid = 3; string state = 4; string mode = 5; string protocol = 6; uint32 spi_in = 7; uint32 spi_out = 8; string encryption_algorithm = 9; uint32 key_length = 10; string integrity_algorithm = 11; uint64 bytes_in = 12; uint64 bytes_out = 13; uint64 packets_in = 14; uint64 packets_out = 15; google.protobuf.Timestamp install_time = 16; uint64 rekey_time = 17; uint64 life_time = 18; repeated string local_traffic_selectors = 19; repeated string remote_traffic_selectors = 20; ipsec.common.v1.EvidenceStatus evidence_status = 21; }
message ListIkeSasRequest { string socket_uri = 1; string ike_name = 2; uint64 ike_unique_id = 3; string state = 4; uint32 page_size = 5; string page_token = 6; } message ListIkeSasResponse { repeated IkeSa ike_sas = 1; string next_page_token = 2; } message GetIkeSaRequest { string socket_uri = 1; uint64 ike_unique_id = 2; }
message ListChildSasRequest { string socket_uri = 1; string ike_name = 2; uint64 child_unique_id = 3; string state = 4; uint32 page_size = 5; string page_token = 6; } message ListChildSasResponse { repeated ChildSa child_sas = 1; string next_page_token = 2; } message GetChildSaRequest { string socket_uri = 1; uint64 child_unique_id = 2; }
message StrongSwanConnection { string name = 1; string ike_version = 2; repeated string authentication_methods = 3; repeated string ike_proposals = 4; repeated string child_definitions = 5; repeated string local_traffic_selectors = 6; repeated string remote_traffic_selectors = 7; uint64 life_time = 8; uint64 rekey_time = 9; string pfs_key_exchange = 10; ipsec.common.v1.EvidenceStatus evidence_status = 11; }
message ListConnectionsRequest { string socket_uri = 1; uint32 page_size = 2; string page_token = 3; } message ListConnectionsResponse { repeated StrongSwanConnection connections = 1; string next_page_token = 2; } message GetConnectionRequest { string socket_uri = 1; string name = 2; }
message ViciPolicy { string name = 1; string direction = 2; string source = 3; string destination = 4; string protocol = 5; ipsec.common.v1.EvidenceStatus evidence_status = 6; } message ListViciPoliciesRequest { string socket_uri = 1; uint32 page_size = 2; string page_token = 3; } message ListViciPoliciesResponse { repeated ViciPolicy policies = 1; string next_page_token = 2; }
message ViciAlgorithm { string name = 1; string algorithm_type = 2; repeated string implementations = 3; ipsec.common.v1.EvidenceStatus evidence_status = 4; } message ListAlgorithmsRequest { string socket_uri = 1; } message ListAlgorithmsResponse { repeated ViciAlgorithm algorithms = 1; }
message GetCountersRequest { string socket_uri = 1; string connection_name = 2; bool all_connections = 3; } message ViciCounters { map<string, uint64> values = 1; ipsec.common.v1.EvidenceStatus evidence_status = 2; }
message Certificate { string certificate_type = 1; string subject = 2; string issuer = 3; google.protobuf.Timestamp valid_from = 4; google.protobuf.Timestamp valid_until = 5; string fingerprint = 6; string public_key_type = 7; ipsec.common.v1.EvidenceStatus evidence_status = 8; } message ListCertificatesRequest { string socket_uri = 1; } message ListCertificatesResponse { repeated Certificate certificates = 1; }
message Authority { string name = 1; string subject = 2; string issuer = 3; ipsec.common.v1.EvidenceStatus evidence_status = 4; } message ListAuthoritiesRequest { string socket_uri = 1; } message ListAuthoritiesResponse { repeated Authority authorities = 1; }
message SourceAvailability { string source = 1; bool available = 2; string error_code = 3; string message = 4; } message GetGatewaySnapshotRequest { string socket_uri = 1; } message GatewaySnapshot { ViciDaemonStats daemon_stats = 1; repeated IkeSa ike_sas = 2; repeated ChildSa child_sas = 3; repeated StrongSwanConnection connections = 4; repeated ViciPolicy policies = 5; repeated ViciAlgorithm algorithms = 6; ViciCounters counters = 7; repeated Certificate certificates = 8; repeated Authority authorities = 9; google.protobuf.Timestamp snapshot_timestamp = 10; repeated SourceAvailability per_source_availability = 11; string schema_version = 12; }
enum ViciEventType { VICI_EVENT_TYPE_UNSPECIFIED = 0; IKE_SA_CREATED = 1; IKE_SA_UPDATED = 2; IKE_SA_DELETED = 3; CHILD_SA_ESTABLISHED = 4; CHILD_SA_DELETED = 5; CHILD_SA_REKEYED = 6; AUTHENTICATION_EVENT = 7; } message StreamViciEventsRequest { string socket_uri = 1; uint32 buffer_size = 2; } message ViciEvent { ViciEventType type = 1; string ike_name = 2; uint64 ike_unique_id = 3; string child_name = 4; uint64 child_unique_id = 5; google.protobuf.Timestamp timestamp = 6; ipsec.common.v1.EvidenceStatus evidence_status = 7; }
