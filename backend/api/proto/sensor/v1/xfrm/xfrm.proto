syntax="proto3"; package sensor.xfrm.v1;
import "google/protobuf/timestamp.proto"; import "api/proto/common/v1/evidence.proto";
option go_package="github.com/naman9271/SIH26160---Team-Alchemist/gen/go/api/proto/sensor/v1/xfrm;xfrmv1";
service KernelXfrmService { rpc GetCapabilities(GetXfrmCapabilitiesRequest) returns (XfrmCapabilities); rpc ListStates(ListXfrmStatesRequest) returns (ListXfrmStatesResponse); rpc GetState(GetXfrmStateRequest) returns (XfrmState); rpc ListPolicies(ListXfrmPoliciesRequest) returns (ListXfrmPoliciesResponse); rpc GetReplayProtection(GetReplayProtectionRequest) returns (ReplayProtection); rpc GetKernelSnapshot(GetKernelSnapshotRequest) returns (KernelSnapshot); }
message GetXfrmCapabilitiesRequest{} message XfrmCapabilities{bool available=1;bool state_query=2;bool policy_query=3;bool replay_information=4;}
message XfrmState{string source=1;string destination=2;string protocol=3;uint32 spi=4;uint32 reqid=5;string mode=6;string direction=7;string encryption_algorithm=8;uint32 encryption_key_length=9;string aead_algorithm=10;uint32 aead_icv_length=11;string authentication_algorithm=12;string encapsulation=13;uint32 replay_window=14;uint64 sequence=15;bool extended_sequence_numbers=16;uint64 byte_limit=17;uint64 packet_limit=18;uint64 bytes=19;uint64 packets=20;ipsec.common.v1.EvidenceStatus evidence_status=21;}
message ListXfrmStatesRequest{string source=1;string destination=2;string protocol=3;uint32 spi=4;uint32 reqid=5;string mode=6;uint32 page_size=7;string page_token=8;} message ListXfrmStatesResponse{repeated XfrmState states=1;string next_page_token=2;} message GetXfrmStateRequest{string source=1;string destination=2;string protocol=3;uint32 spi=4;}
message XfrmPolicy{string direction=1;string source_selector=2;string destination_selector=3;uint32 priority=4;string source_template=5;string destination_template=6;uint32 reqid=7;string mode=8;string protocol=9;ipsec.common.v1.EvidenceStatus evidence_status=10;} message ListXfrmPoliciesRequest{string direction=1;uint32 reqid=2;uint32 page_size=3;string page_token=4;} message ListXfrmPoliciesResponse{repeated XfrmPolicy policies=1;string next_page_token=2;}
message GetReplayProtectionRequest{string protocol=1;uint32 spi=2;string destination=3;} message ReplayProtection{bool available=1;bool enabled=2;uint32 replay_window=3;uint64 sequence=4;bool extended_sequence_numbers=5;ipsec.common.v1.EvidenceStatus evidence_status=6;}
message GetKernelSnapshotRequest{} message ComponentAvailability{string component=1;bool available=2;string error_code=3;string message=4;} message KernelSnapshot{repeated XfrmState states=1;repeated XfrmPolicy policies=2;repeated ReplayProtection replay_protection=3;google.protobuf.Timestamp snapshot_timestamp=4;repeated ComponentAvailability availability=5;string schema_version=6;}
