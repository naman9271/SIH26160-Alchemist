syntax="proto3"; package sensor.telemetry.v1;
import "google/protobuf/timestamp.proto"; import "api/proto/sensor/v1/flow/flow.proto"; import "api/proto/sensor/v1/xfrm/xfrm.proto";
option go_package="github.com/naman9271/SIH26160---Team-Alchemist/gen/go/api/proto/sensor/v1/telemetry;telemetryv1";
service SensorTelemetryService {rpc GetSnapshot(GetSensorSnapshotRequest)returns(SensorSnapshot);rpc StreamObservations(StreamObservationsRequest)returns(stream SensorObservation);rpc StreamFeatureWindows(StreamSensorFeatureWindowsRequest)returns(stream sensor.flow.v1.FeatureWindow);rpc AcknowledgeCheckpoint(AcknowledgeCheckpointRequest)returns(AcknowledgeCheckpointResponse);}
message SnapshotInclude{bool protocol_summary=1;bool flows=2;bool deep_vici=3;bool deep_xfrm=4;} message GetSensorSnapshotRequest{string sensor_session_id=1;SnapshotInclude include=2;} message SensorSnapshot{string sensor_session_id=1;string session_state=2;uint64 active_flow_count=3;uint64 flow_packet_count=4;uint64 flow_byte_count=5;sensor.xfrm.v1.KernelSnapshot xfrm_snapshot=6;google.protobuf.Timestamp generated_at=7;repeated sensor.xfrm.v1.ComponentAvailability availability=8;}
enum ObservationType{OBSERVATION_TYPE_UNSPECIFIED=0;FLOW_CREATED=1;FLOW_UPDATED=2;FLOW_FINALIZED=3;SENSOR_WARNING=4;SENSOR_ERROR=5;XFRM_STATE_UPDATE=6;} message StreamObservationsRequest{string sensor_session_id=1;bool include_protocol_events=2;bool include_capture_stats=3;bool include_vici_events=4;bool include_xfrm_updates=5;uint32 buffer_size=6;} message SensorObservation{uint64 sequence=1;string sensor_session_id=2;string event_id=3;ObservationType event_type=4;google.protobuf.Timestamp timestamp=5;string source=6;string flow_id=7;string message=8;} message StreamSensorFeatureWindowsRequest{string sensor_session_id=1;uint32 buffer_size=2;} message AcknowledgeCheckpointRequest{string sensor_session_id=1;uint64 last_processed_sequence=2;} message AcknowledgeCheckpointResponse{bool acknowledged=1;}
