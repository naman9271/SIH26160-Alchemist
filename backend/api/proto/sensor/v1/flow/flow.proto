syntax = "proto3";

package sensor.flow.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/naman9271/SIH26160---Team-Alchemist/gen/go/api/proto/sensor/v1/flow;flowv1";

service FlowTelemetryService {
  rpc ListFlows(ListFlowsRequest) returns (ListFlowsResponse);
  rpc GetFlow(GetFlowRequest) returns (Flow);
  rpc GetFlowStats(GetFlowStatsRequest) returns (FlowStats);
  rpc ListFeatureWindows(ListFeatureWindowsRequest) returns (ListFeatureWindowsResponse);
  rpc GetFeatureWindow(GetFeatureWindowRequest) returns (FeatureWindow);
  rpc GetSequenceSketch(GetSequenceSketchRequest) returns (SequenceSketch);
  rpc StreamFeatureWindows(StreamFeatureWindowsRequest) returns (stream FeatureWindow);
}

enum FlowProtocol { FLOW_PROTOCOL_UNSPECIFIED = 0; IKE = 1; ESP = 2; AH = 3; NAT_T = 4; OTHER = 5; }
enum FeatureBackpressurePolicy { FEATURE_BACKPRESSURE_POLICY_UNSPECIFIED = 0; BLOCK_CAPTURE = 1 [deprecated = true]; DROP_FEATURE_WINDOW = 2; CANCEL_SESSION = 3; }

message Flow {
  string flow_id = 1; string session_id = 2; FlowProtocol protocol = 3;
  string source_address = 4; string destination_address = 5; uint32 source_port = 6; uint32 destination_port = 7;
  uint32 spi = 8; google.protobuf.Timestamp first_seen = 9; google.protobuf.Timestamp last_seen = 10;
  uint64 packet_count = 11; uint64 byte_count = 12; bool active = 13;
}
message FlowStats {
  string flow_id = 1; uint64 packet_count = 2; uint64 byte_count = 3; uint64 duration_ms = 4;
  uint64 min_packet_size = 5; uint64 max_packet_size = 6; double mean_packet_size = 7; double packet_size_stddev = 8;
  uint64 forward_packets = 9; uint64 reverse_packets = 10; uint64 forward_bytes = 11; uint64 reverse_bytes = 12;
  double mean_interarrival_us = 13; double interarrival_stddev_us = 14; uint64 burst_count = 15;
  double mean_burst_packets = 16; uint64 idle_period_count = 17; double mean_idle_ms = 18;
}
message ListFlowsRequest { string sensor_session_id = 1; FlowProtocol protocol = 2; uint32 spi = 3; string source_address = 4; string destination_address = 5; optional bool active = 6; uint32 page_size = 7; string page_token = 8; }
message ListFlowsResponse { repeated Flow flows = 1; string next_page_token = 2; }
message GetFlowRequest { string flow_id = 1; }
message GetFlowStatsRequest { string flow_id = 1; }

message FeatureWindowSummary { string window_id = 1; string flow_id = 2; string session_id = 3; google.protobuf.Timestamp window_start = 4; google.protobuf.Timestamp window_end = 5; string feature_schema_version = 6; string sequence_schema_version = 7; uint64 packet_count = 8; bool finalized = 9; string eviction_reason = 10; }
message FeatureWindow { string window_id = 1; string flow_id = 2; string session_id = 3; google.protobuf.Timestamp window_start = 4; google.protobuf.Timestamp window_end = 5; string feature_schema_version = 6; string sequence_schema_version = 7; repeated string feature_names = 8; repeated double feature_values = 9; string normalization_profile = 10; string direction_convention = 11; uint64 window_duration_ms = 12; uint64 packet_count = 13; bool finalized = 14; string eviction_reason = 15; string aggregation_scope = 16; }
message ListFeatureWindowsRequest { string flow_id = 1; uint32 page_size = 2; string page_token = 3; }
message ListFeatureWindowsResponse { repeated FeatureWindowSummary windows = 1; string next_page_token = 2; }
message GetFeatureWindowRequest { string window_id = 1; }
message SequencePacket { sint64 signed_size = 1; uint64 delta_time_us = 2; }
message SequenceSketch { string flow_id = 1; string window_id = 2; string sequence_schema_version = 3; repeated SequencePacket packets = 4; }
message GetSequenceSketchRequest { string window_id = 1; }
message StreamFeatureWindowsRequest { string sensor_session_id = 1; FeatureBackpressurePolicy backpressure_policy = 2; uint32 buffer_size = 3; }
